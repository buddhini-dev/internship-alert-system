name: Internship Alert System

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"

  # Allows you to run it manually from GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  internship-alert:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run internship alert system
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}

          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 587

          MAX_JOB_AGE_DAYS: 14
          MAX_JOBS_PER_EMAIL: 20

          REQUEST_DELAY: 2
          MAX_RETRIES: 3

        run: |
          python main.py

      - name: Save updated job history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/seen_jobs.json

          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Update seen jobs"
            git push
          fi
